<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Naksha · draw a map, watch it play</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0c1016;
      --panel: #141b24;
      --border: #344252;
      --text: #f1f5fb;
      --muted: #bac7d6;
      --accent: #7ce0d1;
      --error: #ff9c9f;
      font: 16px/1.45 system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--text); }
    main {
      display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 10px; height: 100dvh; padding: 10px clamp(8px, 2vw, 28px);
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 1.5rem; letter-spacing: -.035em; }
    h1 strong { color: var(--accent); }
    h2 { font-size: 1.2rem; }
    .card { border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }
    .toolbar { position: relative; display: flex; align-items: center; justify-content: space-between; }
    summary {
      cursor: pointer; padding: 6px 12px; border: 1px solid var(--border);
      border-radius: 7px; background: var(--panel); font-weight: 650;
    }
    .editor {
      position: absolute; z-index: 1; top: calc(100% + 8px); right: 0;
      width: min(480px, 100%); max-height: calc(100dvh - 175px); overflow: auto;
      box-shadow: 0 12px 30px #0008;
    }
    .viewport { position: relative; overflow: hidden; background: #070b10; }
    #frame { display: block; width: 100%; height: 100%; object-fit: contain; }
    #screen-message {
      position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
      background: #0c1016a8; text-align: center; font-size: clamp(1rem, 2.4vw, 1.5rem);
    }
    #screen-message[hidden], [hidden] { display: none; }
    .editor, .panel { padding: 10px 14px; }
    .panel header { display: flex; align-items: baseline; gap: 4px 16px; flex-wrap: wrap; }
    label { display: block; font-weight: 650; }
    #examples, .wad-fields { margin-bottom: 10px; }
    textarea, select, input, button { color: inherit; font: inherit; }
    textarea, select, input {
      width: 100%; border: 1px solid #536279; border-radius: 6px;
      padding: 6px 9px; background: #0c1119;
    }
    label + select, label + textarea, label + input { margin-top: 4px; }
    .wad-fields { display: grid; grid-template-columns: 1fr 7em; gap: 8px; }
    .wad-fields > label { grid-column: 1 / -1; }
    textarea:disabled { opacity: .5; }
    textarea {
      display: block; min-height: 5em; height: clamp(5em, 18vh, 13em); resize: vertical;
      white-space: pre; font-family: ui-monospace, monospace; line-height: 1.25; color: #e6f0fb;
    }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .legend { display: flex; gap: 4px 12px; flex-wrap: wrap; margin: 8px 0 12px; color: var(--muted); font-size: .85rem; }
    .legend span { display: inline-block; }
    .legend code { color: var(--text); font-size: 1em; font-weight: bold; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-top: 10px; }
    .controls > * { flex: 1 0 auto; }
    button {
      min-height: 46px; padding: 4px 14px; border: none; border-radius: 7px;
      background: var(--accent); color: #092420; font-size: 1.2rem; font-weight: 800; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #memory { background: #253543; color: var(--text); }
    #memory[aria-checked="false"] { background: #a5212f; }
    .error { color: var(--error); margin-top: 8px; font-weight: 650; }
    .numbers { font-variant-numeric: tabular-nums; }
    #events { max-height: clamp(1.5em, 12dvh, 5.8em); overflow: auto; margin: 4px 0 0; padding-left: 1.35rem; }
    .muted { color: var(--muted); }
    #outcome { margin-left: auto; color: var(--accent); font-weight: 750; }
    #outcome[data-result="dead"] { color: var(--error); }
    #outcome[data-result="timeout"], #desync { color: #ffda86; }
  </style>
</head>
<body>
<main>
  <header class="toolbar">
    <h1><strong>Naksha</strong></h1>
    <details id="drawer">
      <summary>Map controls</summary>
      <form id="editor" class="editor card">
        <label for="examples">Example map</label>
        <select id="examples"><option value="">Custom map</option></select>
        <div class="wad-fields">
          <label for="wad">Load map file</label>
          <input id="wad" type="text" placeholder="/absolute/path/to/level.wad" spellcheck="false" autocomplete="off">
          <input id="map-name" type="text" value="MAP01" aria-label="Map name" spellcheck="false" maxlength="8">
        </div>
        <label for="grid">ASCII grid</label>
        <textarea id="grid" rows="8" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" aria-describedby="legend error"></textarea>
        <p class="legend" id="legend">
          <span><code>#</code> wall</span><span><code>.</code> floor</span>
          <span><code>P</code> start</span><span><code>E</code> exit</span>
          <span><code>D</code> door</span><span><code>R B Y</code> locked doors</span>
          <span><code>r b y</code> keycards</span><span><code>z s c i d</code> monsters</span>
          <span><code>h m a k l</code> items</span>
        </p>
        <div class="controls">
          <div>
            <label for="speed">Speed</label>
            <select id="speed">
              <option value="0.5">0.5×</option><option value="1" selected>1× real time</option>
              <option value="2">2×</option><option value="4">4×</option>
            </select>
          </div>
          <button id="memory" type="button" role="switch" aria-label="Memory" aria-checked="true">Memory: ON</button>
          <button id="play" type="submit">Play</button>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
      </form>
    </details>
  </header>
  <section class="viewport card" aria-label="Live episode">
    <img id="frame" width="1600" height="900" alt="First-person game view, audience map, and episode status">
    <p id="screen-message">Choose or type a map, then press Play.</p>
  </section>
  <section class="panel card" aria-labelledby="events-title">
    <header>
      <h2 id="events-title">Event log</h2>
      <span id="clock" class="numbers muted">Step — · Tic —</span>
      <span id="desync" hidden></span>
      <p id="outcome" role="status" hidden></p>
    </header>
    <p id="empty-log" class="muted">Waiting for events.</p>
    <ol id="events" hidden></ol>
  </section>
</main>
<script>
  const byId = id => document.getElementById(id);
  const form = byId('editor');
  const grid = byId('grid');
  const wad = byId('wad');
  const mapName = byId('map-name');
  const memory = byId('memory');
  const examples = byId('examples');
  const frame = byId('frame');
  const screenMessage = byId('screen-message');
  const error = byId('error');
  const events = byId('events');
  const outcome = byId('outcome');
  const drawer = byId('drawer');
  const outcomes = {exit: 'Exit reached', dead: 'Naksha died', timeout: 'Time ran out',
    spectator_desync: 'Spectator ended early'};
  let maps = [];
  let posting = false;
  let pollInFlight = false;
  let requestEpoch = 0;
  let expectedRun = null;
  let lastPoll = -100;
  let displayed = '';
  let frameUrl = null;
  let eventText = '';
  let pollError = false;

  function showError(message) {
    error.textContent = message;
    error.hidden = !message;
    if (message) drawer.open = true;
  }

  async function getJson(path, options) {
    const response = await fetch(path, {cache: 'no-store', ...options});
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || 'The server could not complete the request.');
    return body;
  }

  async function loadMaps() {
    try {
      const [grids, shortcuts] = await Promise.all([getJson('/maps'), getJson('/wad-shortcuts')]);
      maps = [...grids, ...shortcuts];
      maps.forEach((spec, index) => {
        const option = new Option(spec.family ? spec.id + ' · ' + spec.family : spec.id, String(index));
        examples.add(option);
      });
      if (grids.length && !grid.value && !wad.value) {
        examples.value = '0';
        grid.value = grids[0].grid;
      }
    } catch (failure) {
      showError('Could not load example maps. ' + failure.message);
    }
  }

  examples.addEventListener('change', () => {
    const spec = examples.value === '' ? {} : maps[Number(examples.value)];
    wad.value = spec.wad || '';
    mapName.value = spec.map || 'MAP01';
    grid.disabled = Boolean(spec.wad);
    if (spec.grid) grid.value = spec.grid;
    showError('');
  });
  function editWad() {
    examples.value = '';
    grid.disabled = Boolean(wad.value.trim());
    showError('');
  }
  wad.addEventListener('input', editWad);
  mapName.addEventListener('input', editWad);
  grid.addEventListener('input', () => {
    if (examples.value !== '' && grid.value !== maps[Number(examples.value)].grid) examples.value = '';
    showError('');
  });
  memory.addEventListener('click', () => {
    const enabled = memory.getAttribute('aria-checked') !== 'true';
    memory.setAttribute('aria-checked', String(enabled));
    memory.textContent = enabled ? 'Memory: ON' : 'Memory: OFF';
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (posting) return;
    posting = true;
    requestEpoch++;
    byId('play').disabled = true;
    pollError = false;
    showError('');
    try {
      const source = wad.value.trim() ? {wad: wad.value.trim(), map: mapName.value.trim()} : {grid: grid.value};
      const reply = await getJson('/run', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({...source, speed: Number(byId('speed').value),
          memory: memory.getAttribute('aria-checked') === 'true' ? 'on' : 'off'})
      });
      expectedRun = reply.run_id;
      displayed = '';
      drawer.open = false;
      drawer.querySelector('summary').focus();
      updateState({outcome: 'running', health: null, events: []});
    } catch (failure) {
      showError(failure.message);
    } finally {
      posting = false;
      byId('play').disabled = false;
    }
  });

  function updateState(state) {
    const ready = state.health != null;
    byId('clock').textContent = ready ? `Step ${state.step} · Tic ${state.tic}` : 'Step — · Tic —';
    const desync = byId('desync');
    desync.hidden = state.spectator_desync_step == null;
    desync.textContent = desync.hidden ? '' : `Spectator desync · Step ${state.spectator_desync_step}`;

    const text = state.events.join('\n');
    if (text !== eventText) {
      eventText = text;
      events.replaceChildren(...state.events.map(message => {
        const item = document.createElement('li');
        item.textContent = message;
        return item;
      }));
      events.scrollTop = events.scrollHeight;
    }
    byId('empty-log').hidden = state.events.length > 0;
    events.hidden = !state.events.length;
    const result = outcomes[state.outcome] || '';
    if (outcome.textContent !== result) outcome.textContent = result;
    outcome.dataset.result = state.outcome || '';
    outcome.hidden = !result;
    screenMessage.hidden = ready;
    if (!ready) {
      screenMessage.textContent = state.error ? 'Episode unavailable.' :
        state.outcome === 'running' ? 'Starting episode…' : 'Choose or type a map, then press Play.';
    }
  }

  async function poll() {
    const epoch = requestEpoch;
    try {
      const state = await getJson('/state');
      if (epoch !== requestEpoch || (expectedRun !== null && state.run_id < expectedRun)) return;
      if (pollError) {
        showError('');
        pollError = false;
      }
      const marker = JSON.stringify([state.run_id, state.step, state.health, state.outcome, state.error]);
      if (displayed === marker) return;

      const response = await fetch('/frame.png', {cache: 'no-store'});
      if (!response.ok) throw new Error('Could not load the live frame.');
      const blob = await response.blob();
      if (epoch !== requestEpoch) return;
      const previousUrl = frameUrl;
      frameUrl = URL.createObjectURL(blob);
      frame.src = frameUrl;
      if (previousUrl) URL.revokeObjectURL(previousUrl);
      displayed = marker;
      updateState(state);
      if (state.error) showError(state.error);
    } catch (failure) {
      if (epoch === requestEpoch && !error.textContent) {
        showError(failure.message);
        pollError = true;
      }
    } finally {
      pollInFlight = false;
    }
  }

  function refresh(now) {
    if (!posting && !pollInFlight && now - lastPoll >= 100) {
      lastPoll = now;
      pollInFlight = true;
      void poll();
    }
    requestAnimationFrame(refresh);
  }

  void loadMaps();
  requestAnimationFrame(refresh);
</script>
</body>
</html>
