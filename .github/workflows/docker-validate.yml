name: Docker validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af
      - name: Build validation image
        run: docker build -t devforge-doom .
      - name: Validate submission on CPU
        # The host launcher uses Python's standard library. GPU memory is unchecked on this CPU runner.
        run: python validate.py --docker --image devforge-doom --no-gpu
